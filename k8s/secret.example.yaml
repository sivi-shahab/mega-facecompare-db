# Secret tidak termasuk kustomization (k8s/base). Di environment bersama, Secret dibuat sekali per namespace
# (dipakai bersama admin, api, db) — lihat docs/DEPLOYMENT.md di repo mega-facecompare-deploy.
# CONTOH SAJA — JANGAN isi nilai asli di file ini / di git.
# Buat Secret di cluster dengan nilai asli, mis.:
#   kubectl -n <ns> create secret generic compreface-postgres-credentials \
#     --from-literal=POSTGRES_USER=compreface --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)"
#   kubectl -n <ns> create secret generic compreface-admin-secrets \
#     --from-literal=SECURITY_SIGNINGKEY="$(openssl rand -hex 32)" \
#     --from-literal=EMAIL_USERNAME= --from-literal=EMAIL_PASSWORD=
# atau gunakan mekanisme secret management bank (Vault / Sealed Secrets / External Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: compreface-postgres-credentials
type: Opaque
stringData:
  POSTGRES_USER: "<isi-username-db>"
  POSTGRES_PASSWORD: "<isi-password-db-kuat>"
